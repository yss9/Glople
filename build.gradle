plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.3'
    id 'io.spring.dependency-management' version '1.1.4'
}

group = 'proj'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = '17'
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    compileOnly 'org.projectlombok:lombok'
    implementation 'com.mysql:mysql-connector-j:8.0.33'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.projectreactor:reactor-test'

    implementation 'org.springframework.security:spring-security-crypto:5.7.1'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'io.jsonwebtoken:jjwt:0.9.1'
    implementation 'javax.xml.bind:jaxb-api:2.3.0'
    implementation 'org.springframework.boot:spring-boot-devtools'
    implementation 'com.google.cloud:google-cloud-speech:1.28.0'
    implementation 'org.jboss.logging:jboss-logging:3.4.2.Final'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'
}

tasks.named('test') {
    useJUnitPlatform()
}

// 검증 서류(대행자 신분·자격 증빙)는 클래스패스 정적 리소스로 복사하지 않는다.
// 복사되면 스프링 부트 기본 정적 핸들러(/** → classpath:/static/)가 경로 표기만 바꾼 요청(대소문자, Windows의 8.3 이름·끝 점 등)으로
// 내보낼 수 있다. 서류는 본인·관리자만 GET /api/users/verification-file/{userId}로 받는다. (SecurityConfig도 정적 경로를 차단)
tasks.named('processResources') {
    exclude 'static/verification-files/**'
}
