[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "glople-agent"
version = "0.0.1"
description = "Glople 여행 도우미 LangGraph 에이전트"
requires-python = ">=3.12,<3.13"
# 2026-10-03 이전 업로드로 고정 (docs/design.md 3.3절)
dependencies = [
    "langgraph==1.2.12",
    "langgraph-prebuilt==1.1.0",
    "langgraph-checkpoint==4.2.0",
    "langgraph-checkpoint-sqlite==3.1.1",  # M3: SqliteSaver(aiosqlite·sqlite-vec를 함께 끌어옴, requirements.lock)
    "langchain-core==1.6.6",
    "langchain-openai==1.6.7",
    "openai==3.24.0",
    "pydantic==2.13.5",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "respx==0.23.1",
]
# M5 서비스(FastAPI /ai-api/v1, SSE). `pip install -e ".[dev,server]"`. 서비스 테스트(tests/test_service_*.py)도 이것이 있어야 돈다
server = [
    "fastapi==0.142.2",       # starlette 1.7.0·annotated-doc·opentelemetry-api를 함께 끌어옴(requirements.lock)
    "uvicorn==0.54.0",        # 표준 h11만(uvloop·httptools 없음)
    "httpx-sse==0.4.3",       # 테스트·CLI에서 SSE 읽기
    "pytest-asyncio==1.4.0",  # 서비스의 비동기 테스트(strict 모드, 기존 테스트에는 영향 없음)
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
